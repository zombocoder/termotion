[package]
name = "termotion-cli"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "termotion"
path = "src/main.rs"

[dependencies]
clap = { version = "4.6.6", features = ["derive"] }
serde_json = "1.0.151"
termotion-core = { path = "../termotion-core" }
termotion-schema = { path = "../termotion-schema" }
termotion-timeline = { path = "../termotion-timeline" }
termotion-render = { path = "../termotion-render" }
termotion-encode = { path = "../termotion-encode" }
clap_complete = "4.6.9"

[dev-dependencies]
assert_cmd = "2.2.2"
predicates = "3.1.4"
png = "0.18.1"
